[pytest]
# pytest 配置：所有测试类型共用一套运行器
testpaths = ui/tests api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -p no:cacheprovider

# 标记：用于按类型筛选
markers =
    ui: UI 测试（浏览器自动化）
    api: 接口测试
    perf: 性能测试
    security: 安全测试
    smoke: 冒烟测试（快速验证环境）
    slow: 慢速测试
    flaky_check: 用于不稳定用例检测

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
