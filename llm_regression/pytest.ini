[pytest]
# 用例发现：只收本目录，避免与仓库根目录的测试相互干扰
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts =
    -v
    -ra
    --strict-markers
    --log-cli-level=INFO
    --log-cli-format="%(asctime)s %(levelname)-7s %(name)s | %(message)s"
    --log-cli-date-format="%H:%M:%S"
markers =
    regression: 接口自动化回归主流程
    normal: 正常场景（有效等价类）
    empty: 空输入场景
    oversized: 超长文本场景（边界值）
    illegal: 非法字符 / 异常编码场景
