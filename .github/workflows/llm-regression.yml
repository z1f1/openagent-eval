name: llm-regression

# 触发范围限定在相关文件：只改 llm_regression 或本工作流时才跑
on:
  push:
    paths:
      - "llm_regression/**"
      - ".github/workflows/llm-regression.yml"
  pull_request:
    paths:
      - "llm_regression/**"
      - ".github/workflows/llm-regression.yml"
  workflow_dispatch:
    inputs:
      env:
        description: "运行环境（real 需要配置 LLM_* Secrets）"
        type: choice
        options: [mock, real]
        default: mock

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: llm-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-regression:
    name: Mock 回归门禁（必过）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_regression
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm_regression/requirements.txt

      - name: 安装锁定依赖
        run: python -m pip install -r requirements.txt

      - name: 执行 Mock 全量回归（四类场景）
        env:
          PYTHONIOENCODING: utf-8
        run: python run_tests.py

      - name: 发布 JUnit 结果到 CI
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: llm_regression/reports/junit_mock.xml
          check_name: LLM Regression (Mock)
          fail_on_failure: true
          # 没有 JUnit 文件（例如收集阶段就失败）时也报错，避免“假绿”
          require_tests: true
          detailed_summary: true

      - name: 归档 HTML 报告与 JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-regression-mock-${{ github.run_number }}
          path: |
            llm_regression/reports/report_mock_*.html
            llm_regression/reports/latest_mock.html
            llm_regression/reports/run_summary_mock.md
            llm_regression/reports/junit_mock.xml
          if-no-files-found: warn
          retention-days: 30

  real-regression:
    name: 真实接口回归（需 Secrets）
    # 注意：job 级 if 里不能用 secrets 上下文（GitHub Actions 硬限制），
    # 只能用 github / inputs / needs / vars。
    # 因此用**非敏感**的 Variables 开关 ENABLE_REAL_REGRESSION 控制是否执行，
    # 真正的密钥仍放在 Secrets（加密、日志自动打码）。
    #
    # 两个条件都用「或」兜底：${{ inputs.env }} 与 ${{ github.event.inputs.env }}
    # 在不同 GitHub 版本/触发方式下的可用性不一致，只写一个会出现「配置都对却被跳过」。
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.env == 'real' || github.event.inputs.env == 'real') &&
      vars.ENABLE_REAL_REGRESSION == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_regression
    env:
      # 密钥走 Secrets（加密存储、日志自动打码）
      # 不设 LLM_MODEL：留空会以空字符串覆盖 config.yaml 的默认值，
      # 让配置层的 ${LLM_MODEL:-deepseek-chat} 兜底即可；需要覆盖时再加。
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: 打印触发上下文（便于排查作业被跳过的原因）
        run: |
          echo "event_name     = ${{ github.event_name }}"
          echo "inputs.env     = '${{ inputs.env }}'"
          echo "event.inputs   = '${{ github.event.inputs.env }}'"
          echo "vars 开关      = '${{ vars.ENABLE_REAL_REGRESSION }}'"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm_regression/requirements.txt

      - name: 安装锁定依赖
        run: python -m pip install -r requirements.txt

      - name: 执行真实接口回归
        # 客户端已对连接类异常做 3 次指数退避重试（应对随机 SSL 断连）
        run: python run_tests.py --env real

      - name: 发布 JUnit 结果到 CI
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: llm_regression/reports/junit_real.xml
          check_name: LLM Regression (Real)
          fail_on_failure: true
          require_tests: true

      - name: 归档 HTML 报告与 JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-regression-real-${{ github.run_number }}
          path: |
            llm_regression/reports/report_real_*.html
            llm_regression/reports/latest_real.html
            llm_regression/reports/run_summary_real.md
            llm_regression/reports/junit_real.xml
          if-no-files-found: warn
          retention-days: 30
